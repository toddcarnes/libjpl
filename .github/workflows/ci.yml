# Offline cross-platform CI.
# Default CI remains offline with respect to ephemeris data:
# LIBJPL_FETCH_EPHEMERIDES=OFF everywhere here. Opt-in real-data execution
# lives in ephemerides.yml (workflow_dispatch only). Workflow definitions
# alone do not establish platform coverage; record results from actual runs.
name: ci

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows MSVC ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Doxygen and Graphviz
        run: choco install -y doxygen.install graphviz
      - name: Configure
        run: cmake -S . -B build/ci -DLIBJPL_FETCH_EPHEMERIDES=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure

  windows-clang-cl:
    name: Windows clang-cl ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install Doxygen and Graphviz
        run: choco install -y doxygen.install graphviz
      - name: Configure (clang-cl, Ninja)
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DLIBJPL_FETCH_EPHEMERIDES=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }} --parallel
      - name: Test including jpl_install consumer
        # The jpl_install consumer proves there is no m.lib dependency.
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure

  ubuntu-gcc:
    name: Ubuntu GCC ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update; sudo apt-get install -y doxygen graphviz
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DLIBJPL_FETCH_EPHEMERIDES=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure

  ubuntu-clang:
    name: Ubuntu Clang ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      CC: clang
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update; sudo apt-get install -y doxygen graphviz
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DLIBJPL_FETCH_EPHEMERIDES=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure

  macos-clang:
    name: macOS Clang ${{ matrix.config }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Doxygen and Graphviz
        run: brew install doxygen graphviz
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DLIBJPL_FETCH_EPHEMERIDES=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure

  # The bindings are optional targets, so nothing else in CI compiles or runs
  # them. These jobs enable all four, require each test to be registered (a
  # missing interpreter/SDK must fail rather than silently skip), and then run
  # the full suite (46 baseline + 4 binding tests).
  bindings-windows:
    name: Windows bindings ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cffi
        run: python -m pip install --disable-pip-version-check cffi
      - name: Select Python interpreter for CMake
        # The image carries several Pythons; find_package(Python3) picks the
        # newest while `python` on PATH may be older. Pin CMake to the
        # interpreter that just received cffi so jpl_python_binding registers.
        run: echo "JPL_PYTHON_EXE=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - name: Install Doxygen and Graphviz
        run: choco install -y doxygen.install graphviz
      - name: Configure (all bindings, warnings as errors)
        run: >
          cmake -S . -B build/ci -DLIBJPL_FETCH_EPHEMERIDES=OFF
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          "-DPython3_EXECUTABLE=$env:JPL_PYTHON_EXE"
          -DLIBJPL_BUILD_SHARED=ON
          -DLIBJPL_BUILD_CPP_BINDING=ON
          -DLIBJPL_BUILD_PYTHON_BINDING=ON
          -DLIBJPL_BUILD_CSHARP_BINDING=ON
          -DLIBJPL_BUILD_VBNET_BINDING=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }} --parallel
      - name: Require every binding test to be registered
        shell: pwsh
        run: |
          $registered = (ctest --test-dir build/ci -C ${{ matrix.config }} -N) -join "`n"
          $missing = @()
          foreach ($name in 'jpl_cpp_binding', 'jpl_python_binding', 'jpl_csharp_binding', 'jpl_vbnet_binding') {
            if ($registered -notmatch [regex]::Escape($name)) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Binding tests not registered: $($missing -join ', ')"
            exit 1
          }
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure

  bindings-linux:
    name: Linux bindings ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cffi in a virtual environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev
          python3 -m venv "$RUNNER_TEMP/.venv"
          "$RUNNER_TEMP/.venv/bin/python" -m pip install --disable-pip-version-check cffi
          echo "$RUNNER_TEMP/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update; sudo apt-get install -y doxygen graphviz
      - name: Configure (all bindings, warnings as errors)
        run: >
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DLIBJPL_FETCH_EPHEMERIDES=OFF
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DLIBJPL_BUILD_SHARED=ON
          -DLIBJPL_BUILD_CPP_BINDING=ON
          -DLIBJPL_BUILD_PYTHON_BINDING=ON
          -DLIBJPL_BUILD_CSHARP_BINDING=ON
          -DLIBJPL_BUILD_VBNET_BINDING=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }} --parallel
      - name: Require every binding test to be registered
        run: |
          registered=$(ctest --test-dir build/ci -C ${{ matrix.config }} -N)
          status=0
          for name in jpl_cpp_binding jpl_python_binding jpl_csharp_binding jpl_vbnet_binding; do
            case "$registered" in
              *"$name"*) ;;
              *) echo "::error::$name is not registered"; status=1 ;;
            esac
          done
          exit $status
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure

  sanitizer-asan-ubsan:
    name: Linux ASan/UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update; sudo apt-get install -y doxygen graphviz
      - name: Configure
        run: cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=-fsanitize=address,undefined,float-cast-overflow -fno-omit-frame-pointer" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined,float-cast-overflow" -DLIBJPL_FETCH_EPHEMERIDES=OFF
      - name: Build
        run: cmake --build build/asan --parallel
      - name: Test excluding unsanitized-consumer suites
        # Installed-package and copied-source docs tests are excluded here:
        # they configure an unsanitized consumer that must not be conflated
        # with sanitizer instrumentation.
        run: ctest --test-dir build/asan --output-on-failure -E 'jpl_install|jpl_docs_paths'

  sanitizer-tsan:
    name: Linux TSan (concurrency)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake -S . -B build/tsan -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=-fsanitize=thread -fno-omit-frame-pointer" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread" -DLIBJPL_FETCH_EPHEMERIDES=OFF
      - name: Build
        run: cmake --build build/tsan --parallel
      - name: Test concurrency suites
        # ASan and TSan are never combined.
        run: ctest --test-dir build/tsan -R 'jpl_threads|jpl_mmap' --output-on-failure

  docs:
    name: Docs, licenses, fixtures (Ubuntu GCC Release)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update; sudo apt-get install -y doxygen graphviz
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DLIBJPL_FETCH_EPHEMERIDES=OFF -DLIBJPL_BUILD_DOCS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build (includes Doxygen XML)
        run: cmake --build build/ci --config Release --parallel
      - name: Test docs, licenses, fixtures
        # Symbol inventory and spaces-path checks plus license/header and
        # fixture-integrity suites (these also run in every ordinary build).
        run: ctest --test-dir build/ci -C Release --output-on-failure -R 'jpl_docs_symbols|jpl_docs_paths|jpl_examples|jpl_licenses|jpl_fixture_integrity|jpl_fixture_integrity_negative|jpl_fetch_cache'
